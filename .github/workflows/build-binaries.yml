name: Build binaries
on:
  workflow_dispatch:
    inputs:
      include_ai:
        description: 'Also package the optional offline local model (about 1.3 GB)'
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ai_platform: ubuntu-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            ai_platform: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Prepare optional AI assets
        if: inputs.include_ai && matrix.ai_platform
        run: |
          python3 scripts/package-ai.py package --platform '${{ matrix.ai_platform }}'
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/kubrick package/kubrick
          cp README.md LICENSE-MIT LICENSE-APACHE package/
          tar -czf kubrick-${{ matrix.target }}.tar.gz -C package kubrick README.md LICENSE-MIT LICENSE-APACHE
          shasum -a 256 kubrick-${{ matrix.target }}.tar.gz > kubrick-${{ matrix.target }}.sha256
      - name: Package optional AI edition
        if: inputs.include_ai && matrix.ai_platform
        run: |
          KUBE_AI_DIR="$PWD/package/ai" cargo test --locked --test assistant_local -- --ignored
          python3 scripts/check-ai-runtime.py package/ai
          cargo run --locked --example assistant-eval
          tar -czf kubrick-ai-${{ matrix.target }}.tar.gz -C package .
          shasum -a 256 kubrick-ai-${{ matrix.target }}.tar.gz > kubrick-ai-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kubrick-${{ matrix.target }}
          path: |
            kubrick-*.tar.gz
            kubrick-*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "kubrick $TAG" --generate-notes --verify-tag
