[package]
name = "kubrick"
version = "0.1.0"
edition = "2024"
description = "Kubernetes, at terminal speed: a fast, read-only-by-default cluster explorer TUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ashark-ai-05/kubrick"
homepage = "https://github.com/ashark-ai-05/kubrick"
readme = "README.md"
keywords = ["kubernetes", "tui", "k8s", "terminal", "kubectl"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/docs/images/demo.gif", "/docs/superpowers", "/.superpowers", "/.remember", "/scripts"]

[lib]
name = "kubrick"
path = "src/lib.rs"

[[bin]]
name = "kubrick"
path = "src/main.rs"

[dependencies]
kube = { version = "4.2", features = ["runtime", "client", "derive", "oidc", "http-proxy", "socks5", "gzip"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
indexmap = "2"
chrono = "0.4"
anyhow = "1"
thiserror = "2"
http = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
serde_norway = "0.9"
regex = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
getrandom = "0.3"

[[bench]]
name = "responsiveness"
harness = false
